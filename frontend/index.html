<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plum Claims</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fraunces:ital,wght@0,400;0,600;0,700;1,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --plum-900: #1A0B40;
        --plum-800: #2D1165;
        --plum-700: #4A1B8A;
        --plum-600: #6027AE;
        --plum-500: #7C3AED;
        --plum-400: #9D5CF5;
        --plum-300: #C4B5FD;
        --plum-200: #DDD6FE;
        --plum-100: #EDE9FE;
        --plum-50:  #F5F3FF;

        --surface-base:    #FAFAF9;
        --surface-card:    #FFFFFF;
        --surface-sunken:  #F3F2F0;
        --surface-sidebar: #0F0A1E;
        --surface-sidebar-hover:  #1D1433;
        --surface-sidebar-active: #2D1B54;

        --text-primary:   #0F0A1A;
        --text-secondary: #4A4453;
        --text-tertiary:  #7E7689;
        --text-disabled:  #B0ABBA;
        --text-inverse:   #FFFFFF;

        --border-default: #E5E2DF;
        --border-strong:  #C8C5C0;
        --border-focus:   var(--plum-500);

        --shadow-sm:  0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
        --shadow-md:  0 4px 12px rgba(79,29,148,0.08);
        --shadow-lg:  0 8px 24px rgba(0,0,0,0.12);

        --radius-sm:  4px;
        --radius-md:  8px;
        --radius-lg:  12px;
        --radius-xl:  16px;
        --radius-pill: 99px;

        --font-display: 'Fraunces', Georgia, serif;
        --font-ui:      'Plus Jakarta Sans', -apple-system, sans-serif;
        --font-mono:    'JetBrains Mono', monospace;

        --status-approved-fg:  #166534; --status-approved-bg:  #F0FDF4; --status-approved-bd:  #BBF7D0;
        --status-rejected-fg:  #991B1B; --status-rejected-bg:  #FEF2F2; --status-rejected-bd:  #FECACA;
        --status-review-fg:    #B45309; --status-review-bg:    #FFFBEB; --status-review-bd:    #FDE68A;
        --status-docs-fg:      #7C3AED; --status-docs-bg:      #F5F3FF; --status-docs-bd:      #C4B5FD;
        --status-paid-fg:      #065F46; --status-paid-bg:      #ECFDF5; --status-paid-bd:      #6EE7B7;
        --status-escalated-fg: #9F1239; --status-escalated-bg: #FFF1F2; --status-escalated-bd: #FECDD3;
      }

      html, body, #root {
        height: 100%;
        font-family: var(--font-ui);
        background: var(--surface-base);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
      }

      input, select, textarea, button {
        font-family: inherit;
      }

      a { color: inherit; text-decoration: none; }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #D4D0CC; border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: #B0ABBA; }

      /* Focus ring */
      *:focus-visible {
        outline: 2px solid var(--plum-500);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
