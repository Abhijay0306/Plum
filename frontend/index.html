<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plum Claims</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        /* Mastercard palette */
        --mc-ink:         #141413;
        --mc-charcoal:    #262627;
        --mc-canvas:      #F3F0EE;
        --mc-lifted:      #FCFBFA;
        --mc-white:       #FFFFFF;
        --mc-orange:      #CF4500;
        --mc-orange-lt:   #F37338;
        --mc-slate:       #696969;
        --mc-dust:        #D1CDC7;
        --mc-bone:        #F4F4F4;

        /* Remap plum → ink so existing components pick up the new palette */
        --plum-900: #141413;
        --plum-800: #141413;
        --plum-700: #141413;
        --plum-600: #262627;
        --plum-500: #141413;
        --plum-400: #262627;
        --plum-300: #D1CDC7;
        --plum-200: #D1CDC7;
        --plum-100: #F3F0EE;
        --plum-50:  #FCFBFA;

        /* Surfaces */
        --surface-base:           #F3F0EE;
        --surface-card:           #FCFBFA;
        --surface-sunken:         #F3F0EE;
        --surface-sidebar:        #141413;
        --surface-sidebar-hover:  #262627;
        --surface-sidebar-active: #262627;

        /* Text */
        --text-primary:   #141413;
        --text-secondary: #262627;
        --text-tertiary:  #696969;
        --text-disabled:  #D1CDC7;
        --text-inverse:   #F3F0EE;

        /* Borders */
        --border-default: #D1CDC7;
        --border-strong:  #141413;
        --border-focus:   #141413;

        /* Shadows — Mastercard atmospheric style */
        --shadow-sm:  rgba(0, 0, 0, 0.04) 0px 4px 24px 0px;
        --shadow-md:  rgba(0, 0, 0, 0.08) 0px 24px 48px 0px;
        --shadow-lg:  rgba(0, 0, 0, 0.12) 0px 32px 64px 0px;

        /* Border radii — Mastercard scale (no 8-16 middle ground) */
        --radius-sm:   4px;
        --radius-md:   8px;
        --radius-lg:   20px;
        --radius-xl:   40px;
        --radius-pill: 999px;

        /* Typography */
        --font-ui:      'Sofia Sans', Arial, sans-serif;
        --font-display: 'Sofia Sans', Arial, sans-serif;
        --font-mono:    'JetBrains Mono', monospace;

        /* Semantic status — keep distinct semantic colors */
        --status-approved-fg:  #166534; --status-approved-bg:  #F0FDF4; --status-approved-bd:  #BBF7D0;
        --status-rejected-fg:  #991B1B; --status-rejected-bg:  #FEF2F2; --status-rejected-bd:  #FECACA;
        --status-review-fg:    #B45309; --status-review-bg:    #FFFBEB; --status-review-bd:    #FDE68A;
        --status-docs-fg:      #0F766E; --status-docs-bg:      #F0FDFA; --status-docs-bd:      #99F6E4;
        --status-paid-fg:      #065F46; --status-paid-bg:      #ECFDF5; --status-paid-bd:      #6EE7B7;
        --status-escalated-fg: #9F1239; --status-escalated-bg: #FFF1F2; --status-escalated-bd: #FECDD3;
      }

      html, body, #root {
        height: 100%;
        font-family: var(--font-ui);
        background: var(--surface-base);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
      }

      input, select, textarea, button {
        font-family: inherit;
      }

      a { color: inherit; text-decoration: none; }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--mc-dust); border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: #B0ABBA; }

      *:focus-visible {
        outline: 2px solid var(--mc-ink);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
